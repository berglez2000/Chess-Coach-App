name: chess-coach-app

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chess_coach
      POSTGRES_PASSWORD: chess_coach_local
      POSTGRES_DB: chess_coach
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_coach -d chess_coach"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
